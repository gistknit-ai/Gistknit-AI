<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GistKnit AI</title>
<meta name="theme-color" content="#05060F">
<meta name="description" content="GistKnit AI: ask anything, research with sources, write code. Founded by Ved Prakash.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F6B5B'/%3E%3Cpath d='M8 9l8 14 8-14M8 23l8-14 8 14' stroke='%23F0C94A' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<script>try{var p=JSON.parse(localStorage.getItem('gk_prefs')||'{}').theme||'system';var d=p==='dark'||(p==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="cosmos.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Menu">
    <div class="side-top">
      <a class="brand" href="#chat">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2F6B5B"/><path d="M8 9l8 14 8-14M8 23l8-14 8 14" stroke="#F0C94A" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
        <span>GistKnit AI</span><em class="beta">Beta</em>
      </a>
      <button class="icon-btn only-mobile" data-act="closeside" aria-label="Close menu" id="closeBtn"></button>
    </div>
    <button class="newchat" data-act="new" id="newBtn"></button>
    <div class="side-scroll" id="sideList"></div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <a class="acct" href="#settings" id="acct"></a>
      <p class="founder">Founded by <b>Ved Prakash</b></p>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-act="closeside"></div>
  <div class="main">
    <header class="bar">
      <button class="icon-btn menu-btn" data-act="openside" aria-label="Open menu" id="menuBtn"></button>
      <span class="bar-title">GistKnit AI</span>
      <button class="icon-btn" data-act="new" aria-label="New chat" id="composeBtn"></button>
    </header>
    <main id="view"></main>
  </div>
</div>
<script src="config.js"></script>
<script src="cosmos.js"></script>
<script src="app.js"></script>
</body>
</html>
